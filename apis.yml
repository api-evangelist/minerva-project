aid: minerva-project
name: Minerva Project
description: >-
  Minerva Project is a San Francisco based education company founded in 2012 that partners with
  universities, secondary schools and corporate academies to redesign their academic programs around
  active learning, and delivers that redesign on Forum, its own purpose-built synchronous learning
  platform. Forum runs live seminars for up to hundreds of concurrent learners with breakout groups,
  shared whiteboards, polls, tagged video recordings, TalkTime engagement analytics, and assessment
  against explicit learning outcomes. The company also incubated Minerva University and the Minerva
  Baccalaureate. Minerva Project sells institutional partnerships and a licensed platform, not a
  developer product: as of this profiling pass it publishes no public API, no developer portal, and
  no machine-readable contract, and Forum access is provisioned per partner institution behind SSO.
