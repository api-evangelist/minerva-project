note: >-
  Minerva Project publishes no API and therefore ships NO API client SDK in any language. What it
  does publish under its own registry namespaces are forks of third-party open-source libraries it
  uses to build Forum's collaborative editor and video classroom — scoped npm republishes of quill,
  ot-json0, rich-text and html-text-collab-ext, and two PyPI packages from the Minerva engineering
  team. They are recorded here for currency evidence, but every one is `api_client: false` and NO
  `SDKs` pointer is emitted in apis.yml, because crediting these as client libraries would assert an
  API surface that does not exist. Registry currency is the finding: the newest first-party release
  in any registry is 2020-11-23, nearly six years stale as of this pass.
